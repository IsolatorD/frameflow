# Publica una versión: al subir una etiqueta vX.Y.Z (igual a la versión de apps/desktop/package.json)
# se compilan los instaladores en macOS, Windows y Linux y se publican como release de GitHub.
# La release se crea como borrador y solo se publica cuando están todos los instaladores, para que
# las apps instaladas (electron-updater) nunca vean una versión a medio subir.
#
#   pnpm --filter @frameflow/desktop version 0.2.0 --no-git-tag-version   # o editar package.json
#   git commit -am "Versión 0.2.0" && git tag v0.2.0 && git push && git push --tags
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: La etiqueta coincide con la versión de la app
        run: |
          VERSION=$(node -p "require('./apps/desktop/package.json').version")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::La etiqueta $GITHUB_REF_NAME no coincide con la versión $VERSION de apps/desktop/package.json"
            exit 1
          fi
      - name: Crear la release como borrador
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --draft --title "Frameflow ${GITHUB_REF_NAME#v}" --generate-notes

  build:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest # Apple Silicon
          - os: windows-latest
          - os: ubuntu-22.04 # glibc antigua: el AppImage funciona en más distribuciones
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Compilar y subir los instaladores
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ github.token }}
          # Sin cuenta de desarrollador de Apple todavía: sin firma.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          pnpm exec electron-vite build
          node scripts/bundle-remotion.mjs
          pnpm exec electron-builder --publish always

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Publicar la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
