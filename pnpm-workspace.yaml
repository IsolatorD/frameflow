packages:
  - "apps/*"
  - "packages/*"

# Paquetes con scripts de instalación permitidos (binarios nativos).
onlyBuiltDependencies:
  - electron
  - esbuild

# Una sola versión de ONNX Runtime nativo: Kokoro y Whisper (transformers.js) corren en el mismo
# proceso y dos versiones cargadas a la vez hacen fallar a Electron (SIGSEGV al cargar un modelo).
overrides:
  onnxruntime-node: 1.31.1
